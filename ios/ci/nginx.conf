# Like the encore container on the home server: the page and /rest/ (Navidrome) on one address. Filled in by start_servers.sh.
worker_processes 1;
error_log @WORK@/nginx-error.log;
pid @WORK@/nginx/nginx.pid;
events { worker_connections 256; }
http {
  include @MIME@;
  access_log @WORK@/nginx-access.log;
  client_body_temp_path @WORK@/nginx/body;
  proxy_temp_path @WORK@/nginx/proxy;
  fastcgi_temp_path @WORK@/nginx/fcgi;
  uwsgi_temp_path @WORK@/nginx/uwsgi;
  scgi_temp_path @WORK@/nginx/scgi;
  server {
    listen 127.0.0.1:4540;
    server_name _;
    root @WORK@/www;
    index index.html;
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
    location /rest/ {
      proxy_pass http://127.0.0.1:4533;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
