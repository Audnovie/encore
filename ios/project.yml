# Encore's iPhone app. Generate the Xcode project with XcodeGen:
#     cd ios && xcodegen generate
# CI does this on GitHub's Mac runners (.github/workflows/ios.yml).
name: Encore
options:
  bundleIdPrefix: io.github.audnovie
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES

targets:
  Encore:
    type: application
    platform: iOS
    sources:
      - path: Encore
    info:
      path: Encore/Info.plist
      properties:
        CFBundleDisplayName: Encore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # Encore and Navidrome are on plain http:// addresses at home and over Tailscale.
        # (Only this key: adding any of the narrower ATS keys would make iOS ignore it.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Encore connects to your music server on your home network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.audnovie.encore
        PRODUCT_NAME: Encore
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO

  EncoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EncoreTests
    dependencies:
      - target: Encore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.audnovie.encore.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Encore.app/Encore
        BUNDLE_LOADER: $(TEST_HOST)

  EncoreUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EncoreUITests
    dependencies:
      - target: Encore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.audnovie.encore.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Encore

schemes:
  Encore:
    build:
      targets:
        Encore: all
        EncoreTests: [test]
        EncoreUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - EncoreTests
        - EncoreUITests
